}

.habitcolumn {

.habit {
    background: #1e293b;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
}

.habit h3 {
    margin: 0 0 10px;
}

.days {
    display: flex;
    justify-content: space-between;
}

.days input {
    display: none;
}

.days label {
    width: 35px;
    height: 35px;
    background: #334155;
    border-radius: 5px;
    cursor: pointer;
}

.days input:checked + label {
    background: #22c55e;
}

.days label:hover {
    background: #475569;
}

</style>
